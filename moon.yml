$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  check:
    command: 'cargo check --workspace'
    toolchains:
      - rust

  fmt:
    command: 'cargo fmt --all --check'
    toolchains:
      - rust

  lint-src:
    command: 'cargo clippy --workspace --lib --bins --examples -- -D warnings -W clippy::all'
    toolchains:
      - rust
    options:
      runInCI: true

  test:
    command: 'cargo test --workspace'
    toolchains:
      - rust

  build:
    command: 'cargo build --workspace'
    toolchains:
      - rust

  key-encoding-gate:
    command: 'cargo test -p vo-storage key_encoding -- --test-threads=1'
    toolchains:
      - rust
    options:
      runInCI: true

  purge-gate:
    command: 'cargo run --example seed_purge'
    toolchains:
      - rust

  process-boundary-gate:
    command: 'cargo test -p vo-executor --test execution_boundary_tests -- --test-threads=1 && cargo test -p vo-ipc --test spawn_edge_cases'
    toolchains:
      - rust
    options:
      runInCI: true

  ci:
    command: 'moon run :check :test :lint-src :key-encoding-gate :purge-gate'
    options:
      runInCI: true
