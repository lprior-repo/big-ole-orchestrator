[package]
name = "vo-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
test-sim = []

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["time", "sync", "io-util", "process"] }
dashmap = { workspace = true }
chrono = { workspace = true }
libc.workspace = true
tracing.workspace = true
ulid = { workspace = true, features = ["serde"] }

[dev-dependencies]
vo-executor = { path = ".", features = ["test-sim"] }
tokio.workspace = true
proptest.workspace = true
serde_json.workspace = true
criterion.workspace = true
uuid.workspace = true
tempfile.workspace = true

[[bench]]
name = "e2e_bench"
harness = false

[[bench]]
name = "e2e_system_bench"
harness = false

[[bin]]
name = "test_subprocess_helper"
path = "tests/fixtures/src/bin/test_subprocess_helper.rs"

[lints]
workspace = true
