[package]
name = "vo-executor-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.vo-executor]
path = ".."

[[bin]]
name = "step_id_parse"
path = "fuzz_targets/step_id_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "job_id_parse"
path = "fuzz_targets/job_id_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "step_result_json"
path = "fuzz_targets/step_result_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schedule_json"
path = "fuzz_targets/schedule_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "job_json"
path = "fuzz_targets/job_json.rs"
test = false
doc = false
bench = false