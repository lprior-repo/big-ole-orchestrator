[package]
name = "vo-linter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
quote = "1"
criterion = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "linter_bench"
harness = false
[lints]
workspace = true
