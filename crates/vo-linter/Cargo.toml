[package]
name = "vo-linter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[dev-dependencies]
quote = "1"
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "linter_bench"
harness = false
[lints]
workspace = true
