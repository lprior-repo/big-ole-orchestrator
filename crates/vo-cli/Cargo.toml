[package]
name = "vo-cli"
version = "0.1.0"
edition = "2021"
default-run = "vo-cli"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
fjall.workspace = true
vo-storage = { version = "0.1.0", path = "../vo-storage" }
vo-types = { version = "0.1.0", path = "../vo-types" }
tracing.workspace = true
sha2 = "0.10"
toml = "1.1.2"
libc = "0.2.184"

[dev-dependencies]
proptest = "1.4"
rstest = "0.18"
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "cli_bench"
harness = false

[lints]
workspace = true
