[package]
name = "vo-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.vo-core]
path = ".."

[dependencies.vo-types]
path = "../../vo-types"

[[bin]]
name = "admission_thresholds"
path = "fuzz_targets/admission_thresholds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_event_sequence"
path = "fuzz_targets/replay_event_sequence.rs"
test = false
doc = false
bench = false
