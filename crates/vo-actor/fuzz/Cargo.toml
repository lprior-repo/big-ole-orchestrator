[[bin]]
name = "probe_config_parse"
path = "fuzz_targets/probe_config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "port_parse"
path = "fuzz_targets/port_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_addr_parse"
path = "fuzz_targets/channel_addr_parse.rs"
test = false
doc = false
bench = false
