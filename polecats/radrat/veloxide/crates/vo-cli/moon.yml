$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  check:
    command: 'cargo check -p vo-cli'
    toolchains:
      - rust
    options:
      runInCI: true

  fmt:
    command: 'cargo fmt -p vo-cli -- --check'
    toolchains:
      - rust
    options:
      runInCI: true

  lint-src:
    command: 'cargo clippy -p vo-cli --lib --bins --examples -- -D warnings -W clippy::all'
    toolchains:
      - rust
    options:
      runInCI: true

  test:
    command: 'cargo test -p vo-cli'
    toolchains:
      - rust
    options:
      runInCI: true

  purge-gate:
    script: 'cargo run -p vo-storage --example seed_purge && cargo run -p vo-cli -- purge --instance 01H5JYV4XHGSR2F8KZ9BWNRFMA && cargo run -p vo-storage --example verify_purge'
    toolchains:
      - rust
    options:
      runInCI: true
