[workspace]
resolver = "2"
exclude = ["crates/vo-types/fuzz"]
members = [
    "crates/vo-types",
    "crates/vo-storage",
    "crates/vo-api",
    "crates/vo-cli",
    "crates/vo-worker",
    "crates/vo-frontend",
    "crates/vo-linter",
    "crates/vo-actor",
    "crates/vo-core",
    "crates/vo-common",
    "crates/vo-ipc",
    "crates/vo-sdk",
    "crates/vo-sdk-macros",
    "crates/vo-executor",
    "crates/vo-scheduler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["time"] }
futures = "0.3"
async-trait = "0.1"

# Actor framework
ractor = "0.15"

# Graph
petgraph = "0.8"
spqr-tree = "4.0.2"
any-rope = "1.2.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"

# Web framework
axum = "0.8"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
reqwest = { version = "0.12", features = ["json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4", "v5", "serde"] }
ulid = { version = "1", features = ["serde"] }
fjall = "3"
vo-types = { path = "crates/vo-types" }
vo-common = { path = "crates/vo-common" }
vo-core = { path = "crates/vo-core" }
vo-scheduler = { path = "crates/vo-scheduler" }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
regex = "1"
lazy_static = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tap = "1"
itertools = "0.14"
futures-lite = "2"
async-stream = "0.3"
bytes = { version = "1", features = ["serde"] }
tempfile = "3"
dashmap = "6"
crc32fast = "1.3"

# Static analysis (vo-linter)
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

# UI (Dioxus)
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-router = "0.7"

# Error handling
nom = "7"
strum = { version = "0.28", features = ["derive"] }

# Metrics
metrics = "0.24"

# Cryptography
sha2 = "0.10"
blake3 = "1.8"

# Testing
rstest = "0.23"
proptest = "1"
criterion = { version = "0.8", features = ["async_tokio"] }

# Storage internals
memmap2 = "0.9"
parking_lot = "0.12"

# Cryptography (additional)
aes = "0.7"
aes-gcm = "0.9"
rand = "0.8"
generic-array = "0.14"

# Filesystem / OS
notify = "6"
glob = "0.3.3"
libc = "0.2"
toml = "0.8"

# Dev / test utilities
trybuild = "1.0"
insta = "1"
metrics-util = "0.18"
serial_test = "3"

# Storage internals
memmap2 = "0.9"
parking_lot = "0.12"

# Cryptography (additional)
aes = "0.7"
aes-gcm = "0.9"
rand = "0.8"
generic-array = "0.14"

# Filesystem / OS
notify = "6"
glob = "0.3.3"
libc = "0.2"
toml = "0.8"

# Dev / test utilities
trybuild = "1.0"
insta = "1"
metrics-util = "0.18"
serial_test = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[workspace.lints.clippy]
unused_async = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"
borrowed_box = "allow"
cast_possible_truncation = "allow"
collapsible_match = "allow"
doc_overindented_list_items = "allow"
double_must_use = "allow"
expect_used = "allow"
if_same_then_else = "allow"
iter_with_drain = "allow"
manual_let_else = "allow"
match_like_matches_macro = "allow"
match_same_arms = "allow"
match_wildcard_for_single_variants = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
option_if_let_else = "allow"
redundant_field_names = "allow"
should_implement_trait = "allow"
significant_drop_tightening = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unfulfilled_lint_expectations = "allow"
