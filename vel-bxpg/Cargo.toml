[package]
name = "vel-bxpg"
version = "0.1.0"
edition = "2024"
description = "DAG cycle detection with --graph integration"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.6"
rstest = "0.26"
insta = { version = "1.40", features = ["yaml"] }
criterion = "0.5"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "proptest_tests"
path = "tests/proptest_tests.rs"

[[bench]]
name = "cycle_detection"
harness = false
